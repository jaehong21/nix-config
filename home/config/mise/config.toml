[tools]
# Languages and Runtimes
node = "lts"
bun = "1.4"
go = "1.27"
python = "3.15"
rust = { version = "1.96", components = "rust-analyzer", targets = "wasm32-wasip1" }

# Package managers
pipx = "latest"
uv = "latest"

# Coding Assistants
codex = "latest"
claude-code = "latest"
# cursor-cli = "latest"
grok = "latest"
"npm:@opencode/cli" = { version = "latest", bun_args = "--trust" }
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:aicommit2" = "latest"
"npm:skills" = "latest"
"npm:mcporter" = "latest"
"npm:t3" = "latest"
"npm:@loongphy/codex-auth" = "latest"
# "cargo:rikabot" = "latest"
# "npm:tokscale" = "latest"

# LSPs and formatters
"npm:vscode-langservers-extracted" = "latest" # html, css, eslint, html, json, markdown
"pipx:ty" = "latest"

# IaC Tools
terraform = "1.9.3"
terragrunt = "latest"
# pulumi = "latest"
# ansible = "latest"

# CLI
flyctl = "latest"
fnox = "latest"
git-cliff = "latest"
goreleaser = "latest"
hugo = "v0.145.0"
infisical = "latest"
k6 = "latest"
lazydocker = "latest"
mole = "latest"
neovim = "0.12"
pnpm = "latest"
prek = "latest"
rclone = "latest"
restic = "latest"
supabase = "latest"
television = "latest"
yt-dlp = "latest"

"github:channel-io/cht-desk-cli" = "latest"
"github:neurosnap/zmx" = "latest"
"npm:agent-slack" = "latest"
"npm:cf" = "latest"
"npm:kagi-cli" = "latest"
"npm:playwright" = "latest"
"pipx:notebook" = "latest" # jupyter notebook

# "cargo:rustlings" = "latest"
# "github:ViRb3/wgcf" = "2.2.31"
# "github:steipete/gogcli" = "latest"
# "npm:fern-api" = "latest"
# "pipx:modal" = "latest"
# gradle = "8.5"
# java = "corretto-21.0.8"

[settings]
experimental = true
minimum_release_age = "24h" # default
minimum_release_age_excludes = ["codex", "claude-code", "npm:@opencode/cli", "npm:@earendil-works/pi-coding-agent", "npm:t3", "npm:cht-desk-cli"]
tool_update.global_auto = true
self_update.auto = true

[settings.npm]
bun = true
[settings.pipx]
uvx = true
